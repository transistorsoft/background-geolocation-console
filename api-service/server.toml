# ===========================
# Server Configuration
# ===========================
[server]
port = 9000
node_env = "production"
body_parser_limit = "1mb"
data_log = false
dyno = "web.1"
# API surface (JSON over HTTPS):
#   POST /api/register          (public)
#   POST /api/refresh_token     (Authorization: Bearer <token>)
#   GET  /api/devices           (Authorization: Bearer <token>)
#   POST /api/locations         (Authorization: Bearer <token>)

# ===========================
# Database
# ===========================
[database]
# Use a Postgres connection string if available, otherwise SQLite
# database_url = "postgres://user:pass@host:5432/dbname"
database_url = ""
# Optional legacy variable
db_connection_url = ""
# Path for SQLite fallback when database_url is empty.
sqlite_path = "./data/api-service.db"
# When true the service ensures the schema matches create.sql on boot.
auto_migrate = true

