{{define "partials/stats"}}
<div class="panel-heading" id="location-stats">
	{{if .HasSelectedDevice}}
		{{if eq .RangeMode "session"}}
			<p>{{.TotalLocations}} location points from session</p>
		{{else}}
			<p>{{.TotalLocations}} location points in selected range</p>
		{{end}}
	{{else}}
		<p>{{.TotalLocations}} location data points</p>
	{{end}}
</div>
{{end}}
