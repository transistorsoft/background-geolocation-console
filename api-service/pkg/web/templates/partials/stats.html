{{define "partials/stats"}}
<div class="panel-heading" id="location-stats">
	<p>
		{{.TotalLocations}} recent locations
		{{if and .VisibleRangeStart .VisibleRangeEnd}}
			· showing {{.VisibleRangeStart}} to {{.VisibleRangeEnd}}
		{{end}}
		· updates every {{printf "%.0f" .PollEvery.Seconds}}s
	</p>
</div>
{{end}}
